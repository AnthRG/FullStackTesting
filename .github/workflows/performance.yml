name: Performance

# Ejecucion manual: las pruebas de carga no van en cada pull request porque un runner
# compartido no da latencias reproducibles. Este workflow existe para lanzarlas contra el
# sistema ya desplegado (preview/staging) o, sin parametros, contra un stack efimero.
on:
  workflow_dispatch:
    inputs:
      escenario:
        description: Escenario de k6 a ejecutar
        type: choice
        required: true
        default: smoke
        options: [smoke, load, stress, concurrent]
      base_url:
        description: URL de la API desplegada (vacio = levantar el stack en el runner)
        type: string
        required: false
        default: ''
      keycloak_url:
        description: URL de Keycloak del entorno desplegado
        type: string
        required: false
        default: ''
      vus:
        description: Usuarios virtuales
        type: string
        required: false
        default: '20'
      duracion:
        description: Duracion de la meseta (ej. 2m)
        type: string
        required: false
        default: '2m'

jobs:
  k6:
    name: k6 - ${{ inputs.escenario }}
    runs-on: ubuntu-latest
    env:
      PERF_VUS: ${{ inputs.vus }}
      PERF_DURATION: ${{ inputs.duracion }}
      PERF_USERNAME: ${{ secrets.PERF_USERNAME || 'admin' }}
      PERF_PASSWORD: ${{ secrets.PERF_PASSWORD || 'admin' }}
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Levantar el stack efimero
        if: ${{ inputs.base_url == '' }}
        run: docker compose up -d --build db keycloak backend

      - name: Esperar a que el backend responda
        if: ${{ inputs.base_url == '' }}
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "Backend listo."
              exit 0
            fi
            echo "Esperando al backend... intento $i"
            sleep 5
          done
          echo "::error::El backend no respondio a tiempo"
          docker compose logs backend
          exit 1

      - name: Esperar a que el entorno desplegado responda
        if: ${{ inputs.base_url != '' }}
        run: curl -fsS "${{ inputs.base_url }}/actuator/health"

      - name: Ejecutar k6
        env:
          PERF_BASE_URL: ${{ inputs.base_url }}
          PERF_KEYCLOAK_URL: ${{ inputs.keycloak_url }}
        run: |
          # Sin URL explicita se usan los defaults del compose (nombres de servicio).
          if [ -z "$PERF_BASE_URL" ]; then
            unset PERF_BASE_URL PERF_KEYCLOAK_URL
          fi
          docker compose --profile perf run --rm k6 run "/scripts/${{ inputs.escenario }}.js"

      - name: Publicar resultados
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ inputs.escenario }}-results
          path: performance/results
          if-no-files-found: warn

      - name: Apagar contenedores
        if: ${{ always() && inputs.base_url == '' }}
        run: docker compose down -v

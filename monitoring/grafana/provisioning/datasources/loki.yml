apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Convierte el traceId que aparece en la linea de log en un enlace a Tempo.
      # El doble $ es obligatorio: Grafana interpola variables de entorno en provisioning.
      derivedFields:
        - name: TraceID
          matcherRegex: '([0-9a-f]{32})'
          url: '$${__value.raw}'
          datasourceUid: tempo

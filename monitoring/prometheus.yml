global:
  scrape_interval: 15s

scrape_configs:
  - job_name: spring-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8080']

  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

# Base neutral: define los servicios y su cableado interno. No publica puertos ni
# construye imagenes: eso lo aporta el override de cada entorno. Nunca se usa sola.
#   dev            : -f docker-compose.yml -f docker-compose.dev.yml
#   staging y prod : -f docker-compose.yml -f docker-compose.deploy.yml

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fullstacktesting}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fullstacktesting}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - spring

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    networks:
      - spring

  backend:
    image: ${BACKEND_IMAGE:-fullstacktesting-backend:local}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/fullstacktesting}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8081/realms/fullstacktesting}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/fullstacktesting/protocol/openid-connect/certs}
      KEYCLOAK_LOGIN_TOKEN_URI: ${KEYCLOAK_LOGIN_TOKEN_URI:-http://keycloak:8080/realms/fullstacktesting/protocol/openid-connect/token}
      KEYCLOAK_ADMIN_SERVER_URL: ${KEYCLOAK_ADMIN_SERVER_URL:-http://keycloak:8080}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      JWT_EXPECTED_AUDIENCE: ${JWT_EXPECTED_AUDIENCE:-fullstacktesting-api}
      METRICS_NAMESPACE: ${METRICS_NAMESPACE:-local}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-fullstacktesting-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=${METRICS_NAMESPACE:-local}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - spring

  frontend:
    image: ${FRONTEND_IMAGE:-fullstacktesting-frontend:local}
    environment:
      API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8081}
      KEYCLOAK_REALM: ${PUBLIC_KEYCLOAK_REALM:-fullstacktesting}
      KEYCLOAK_CLIENT_ID: ${PUBLIC_KEYCLOAK_CLIENT_ID:-frontend}
    # 127.0.0.1 y no localhost: nginx escucha solo en IPv4 y el wget de BusyBox
    # resuelve localhost a ::1 primero, con lo que el healthcheck da connection refused.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/config.js"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      - backend
    networks:
      - spring

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - backend
    networks:
      - spring

  loki:
    image: grafana/loki:3.3.2
    profiles: [observability]
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki
    networks:
      - spring

  tempo:
    image: grafana/tempo:2.7.0
    profiles: [observability]
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./monitoring/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempodata:/var/tempo
    networks:
      - spring

  alloy:
    image: grafana/alloy:v1.5.1
    profiles: [observability]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo
    networks:
      - spring

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - spring

volumes:
  pgdata:
  promdata:
  grafanadata:
  lokidata:
  tempodata:
  alloydata:

networks:
  spring:
    driver: bridge

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # config.js lo reescribe el entrypoint en cada arranque y no lleva hash en el
    # nombre: si se cachea, el navegador se queda con la config del deploy anterior.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: todas las rutas sirven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

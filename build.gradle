plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.owasp.dependencycheck' version '12.2.2'
}

group = 'pucmm.freddy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

// Los .feature y los steps estan en espanol; fijar la codificacion evita que el texto
// dependa del locale de la maquina que compila.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.hibernate.orm:hibernate-envers'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation platform('io.cucumber:cucumber-bom:7.22.1')
	testImplementation 'io.cucumber:cucumber-java'
	testImplementation 'io.cucumber:cucumber-spring'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine'
	testImplementation 'org.junit.platform:junit-platform-suite'
	testImplementation 'io.rest-assured:rest-assured:5.5.2'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'com.github.dasniko:testcontainers-keycloak:3.7.0'
	testImplementation 'com.nimbusds:nimbus-jose-jwt'
	testImplementation 'org.zaproxy:zap-clientapi:1.16.0'
}

sourceSets {
	test {
		resources {
			srcDir 'keycloak'
		}
	}
}

configurations.matching { it.name.toLowerCase().startsWith('test') }.configureEach {
	resolutionStrategy.eachDependency { details ->
		if (details.requested.group == 'org.apache.groovy') {
			details.useVersion '4.0.22'
		}
	}
}

jacoco {
	toolVersion = '0.8.14'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'security'
	}
	systemProperty 'cucumber.junit-platform.naming-strategy', 'long'
	systemProperty 'cucumber.plugin', 'pretty, html:build/reports/cucumber.html'
	finalizedBy tasks.named('jacocoTestReport')
}

// Los tests de seguridad viven en el mismo source set pero fuera de 'test':
// no cuentan para la cobertura y no alargan el ciclo normal de desarrollo.
tasks.register('securityTest', Test) {
	group = 'verification'
	description = 'JWT, permisos, CORS y autenticacion. Gate de cada PR.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		// Solo Jupiter: el suite de Cucumber vive en el mismo source set y falla
		// al inicializar si un filtro de tags no le selecciona ningun escenario.
		includeEngines 'junit-jupiter'
		includeTags 'security & !zap'
	}
	shouldRunAfter tasks.named('test')
	testLogging {
		events 'passed', 'failed', 'skipped'
	}
}

// El escaneo ZAP levanta un contenedor de ~1 GB y ataca la app: fuera del gate
// de PR, se corre en el job nocturno.
tasks.register('zapScan', Test) {
	group = 'verification'
	description = 'Escaneo OWASP ZAP contra la app levantada en un puerto aleatorio.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeEngines 'junit-jupiter'
		includeTags 'zap'
	}
	testLogging {
		events 'passed', 'failed', 'skipped'
		showStandardStreams = true
	}
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		html.required = true
		xml.required = true
		csv.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn tasks.named('jacocoTestReport')
	violationRules {
		rule {
			// FullstacktestingApplication: clase main sin lógica propia, solo
			// arranca Spring Boot (SpringApplication.run). No se excluye del
			// reporte, solo de esta regla, para no fabricar cobertura sobre
			// código que no tiene ramas ni comportamiento que probar.
			excludes = [
				'pucmm.freddy.fullstacktesting.FullstacktestingApplication'
			]
			limit {
				counter = 'INSTRUCTION'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

// Deliberadamente fuera de 'check': un CVE publicado hoy no puede romper un PR
// que no toco dependencias. Corre en su propio job y en el nocturno.
dependencyCheck {
	formats = ['HTML', 'JSON']
	outputDirectory = layout.buildDirectory.dir('reports/security').get().asFile.path
	suppressionFile = 'config/owasp-suppressions.xml'
	failBuildOnCVSS = 7.0f
	skipConfigurations = ['developmentOnly']
	nvd {
		apiKey = System.getenv('NVD_API_KEY')
		delay = System.getenv('NVD_API_KEY') ? 1000 : 8000
	}
	analyzers {
		nodeEnabled = false
		nodeAuditEnabled = false
		assemblyEnabled = false
	}
}

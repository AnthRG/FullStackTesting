# Analisis de calidad de codigo con SonarQube / SonarCloud.
#
# El escaner se ejecuta despues de las pruebas, porque lee sus informes:
#   ./gradlew test securityTest jacocoTestReport
#   docker run --rm -v "$PWD:/usr/src" -e SONAR_HOST_URL -e SONAR_TOKEN sonarsource/sonar-scanner-cli
#
# SONAR_HOST_URL y SONAR_TOKEN se pasan por entorno: nunca se versionan.

sonar.projectKey=AnthRG_FullStackTesting
sonar.projectName=FullStackTesting
sonar.projectVersion=0.0.1-SNAPSHOT

# --- Codigo analizado ---
# Backend (Java) y frontend (TypeScript) en el mismo proyecto.
sonar.sources=src/main/java,frontend/src
sonar.tests=src/test/java,e2e
sonar.sourceEncoding=UTF-8

# --- Java ---
# Sin las clases compiladas, Sonar no puede resolver tipos y degrada casi todas las reglas.
sonar.java.source=25
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

# --- Informes de pruebas y cobertura ---
# La cobertura sale del XML de JaCoCo; los resultados, de los XML de JUnit de ambas tareas.
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.junit.reportPaths=build/test-results/test,build/test-results/securityTest

# --- Exclusiones del analisis ---
# Artefactos de build, dependencias, resultados de carga y documentacion generada.
sonar.exclusions=\
  **/build/**,\
  **/node_modules/**,\
  frontend/dist/**,\
  frontend/public/**,\
  performance/results/**,\
  docs/anexo-*.md,\
  **/*.min.js

# --- Exclusiones de cobertura ---
# El frontend no tiene pruebas unitarias propias: se verifica por E2E, que Sonar no mide.
# La clase de arranque solo llama a SpringApplication.run: no tiene ramas que cubrir.
sonar.coverage.exclusions=\
  frontend/**,\
  e2e/**,\
  performance/**,\
  scripts/**,\
  **/FullstacktestingApplication.java

# Los .feature son especificacion ejecutable, no codigo duplicado.
sonar.cpd.exclusions=src/test/resources/features/**,src/main/resources/db/**

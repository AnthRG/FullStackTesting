# Alertas de ZAP aceptadas conscientemente.
#
# Formato:  <pluginId> = <motivo> (revisar: YYYY-MM)
#
# Solo aplica a riesgo High/Medium: lo Informational/Low nunca rompe el build.
# Una entrada sin motivo escrito no es una excepcion, es deuda escondida.

10055 = style-src 'unsafe-inline' aplica solo a /swagger-ui, que necesita estilos \
        inyectados para renderizar y no procesa input de usuario. El resto de la API \
        va con default-src 'none' (ver CSP_API en SecurityConfig). Se cierra el dia \
        que Swagger UI se apague en produccion. (revisar: 2027-01)
